<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城际出行 | 乘客端</title>
    <meta name="theme-color" content="#667eea">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="connectPage" class="page active">
        <div class="login-container">
            <div class="login-header">
                <div class="login-logo">🚗</div>
                <h1>城际出行服务</h1>
                <p>忻城-柳州专线 | 乘客端</p>
            </div>
            
            <div class="login-card">
                <div class="form-group">
                    <label>请输入司机分享码</label>
                    <input type="text" id="shareCodeInput" class="form-control" placeholder="输入6位分享码" maxlength="6" style="text-transform: uppercase; letter-spacing: 2px;">
                    <small style="color: #666; font-size: 12px; display: block; margin-top: 5px;">
                        向司机索取分享码
                    </small>
                </div>
                
                <div class="form-group">
                    <button class="btn btn-primary btn-block" onclick="connectDriver()">连接司机</button>
                </div>
                
                <div class="login-tips">
                    <p>💡 分享码由司机提供</p>
                    <p>📱 连接后可查看司机信息并下单</p>
                    <p>📞 订单提交后司机会联系您</p>
                </div>
            </div>
        </div>
    </div>
    
    <div id="passengerPage" class="page">
        <div class="passenger-welcome">
            <h2>城际出行服务</h2>
            <p>忻城-柳州专线 | 专享服务</p>
            
            <div class="driver-info-mini" id="driverInfo">
                <!-- 司机信息动态加载 -->
            </div>
        </div>
        
        <div class="passenger-content">
            <!-- 路线选择 -->
            <div class="card">
                <h3>选择路线</h3>
                <div class="route-selector">
                    <button class="route-btn active" data-route="xcToLz">忻城→柳州</button>
                    <button class="route-btn" data-route="lzToXc">柳州→忻城</button>
                    <button class="route-btn" data-route="xcToLb">忻城→来宾北</button>
                    <button class="route-btn" data-route="gpToXc">古蓬→忻城</button>
                </div>
                
                <div class="route-info" id="routeInfo">
                    <div class="info-item">
                        <span>里程:</span>
                        <span id="routeDistance">151公里</span>
                    </div>
                    <div class="info-item">
                        <span>预计时间:</span>
                        <span id="routeTime">约3小时</span>
                    </div>
                </div>
            </div>
            
            <!-- 位置信息 -->
            <div class="card">
                <h3>位置信息</h3>
                <div class="form-group">
                    <label>上车位置</label>
                    <input type="text" id="pickupLocation" class="form-control" placeholder="例如: 忻城县人民医院门口">
                    <button class="btn btn-small" onclick="getCurrentLocation()" style="margin-top: 10px;">
                        📍 获取当前位置
                    </button>
                </div>
                
                <div class="form-group">
                    <label>具体说明</label>
                    <textarea id="locationNote" class="form-textarea" placeholder="例如: 在小区门口等候、有行李、联系电话等"></textarea>
                </div>
                
                <div class="form-group">
                    <label>乘客姓名 (可选)</label>
                    <input type="text" id="passengerName" class="form-control" placeholder="用于司机联系">
                </div>
                
                <div class="form-group">
                    <label>联系电话 (可选)</label>
                    <input type="tel" id="passengerPhone" class="form-control" placeholder="用于司机联系">
                </div>
            </div>
            
            <!-- 价格计算 -->
            <div class="card">
                <h3>费用计算</h3>
                <div class="price-display">
                    <div class="price-label">预估费用</div>
                    <div class="price-value" id="totalPrice">¥50</div>
                </div>
                
                <div class="price-details">
                    <div class="price-row">
                        <span>基础票价</span>
                        <span id="basePrice">¥50</span>
                    </div>
                    <div class="price-row total">
                        <span>总计</span>
                        <span id="finalPrice">¥50</span>
                    </div>
                </div>
                
                <div style="margin-top: 20px;">
                    <button class="btn btn-primary btn-block" onclick="submitOrder()">提交订单</button>
                    <p style="text-align: center; font-size: 12px; color: #666; margin-top: 10px;">
                        提交后司机会尽快联系您
                    </p>
                </div>
            </div>
            
            <!-- 我的订单 -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">我的订单</div>
                    <button class="btn btn-small" onclick="refreshMyOrders()">刷新</button>
                </div>
                <div id="myOrders" class="order-list">
                    <!-- 订单动态加载 -->
                </div>
            </div>
            
            <!-- 联系司机 -->
            <div class="card">
                <h3>联系司机</h3>
                <div style="text-align: center;">
                    <button class="btn btn-primary" onclick="contactDriver()" style="margin-bottom: 10px;">
                        📞 拨打司机电话
                    </button>
                    <p style="font-size: 12px; color: #666;">
                        如有问题请直接联系司机
                    </p>
                </div>
            </div>
        </div>
        
        <!-- 底部导航 -->
        <div class="tab-bar">
            <button class="tab-item active" onclick="switchTab('home')">
                <span class="tab-icon">🏠</span>
                <span>首页</span>
            </button>
            <button class="tab-item" onclick="switchTab('orders')">
                <span class="tab-icon">📋</span>
                <span>订单</span>
            </button>
            <button class="tab-item" onclick="contactDriver()">
                <span class="tab-icon">📞</span>
                <span>联系</span>
            </button>
            <button class="tab-item" onclick="showHelp()">
                <span class="tab-icon">❓</span>
                <span>帮助</span>
            </button>
        </div>
    </div>
    
    <script>
        const API_BASE = window.location.hostname === 'localhost' ? 
            'http://localhost:3000/api' : 
            window.location.origin + '/api';
        
        let currentDriver = null;
        let currentRoute = 'xcToLz';
        let shareCode = null;
        
        // 页面加载时检查URL参数
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            
            if (code) {
                document.getElementById('shareCodeInput').value = code.toUpperCase();
                connectDriver();
            }
        });
        
        async function connectDriver() {
            const code = document.getElementById('shareCodeInput').value.trim().toUpperCase();
            
            if (!code || code.length !== 6) {
                alert('请输入6位有效分享码');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/drivers/share/${code}`);
                const data = await response.json();
                
                if (data.success && data.driver) {
                    currentDriver = data.driver;
                    shareCode = code;
                    
                    // 保存到本地
                    localStorage.setItem('passengerShareCode', code);
                    localStorage.setItem('passengerDriver', JSON.stringify(data.driver));
                    
                    showPassengerPage();
                    updateDriverInfo();
                    calculatePrice();
                } else {
                    alert('分享码无效，请检查后重试');
                }
            } catch (error) {
                alert('网络连接失败，请稍后重试');
            }
        }
        
        function showPassengerPage() {
            document.getElementById('connectPage').classList.remove('active');
            document.getElementById('passengerPage').classList.add('active');
        }
        
        function updateDriverInfo() {
            const container = document.getElementById('driverInfo');
            if (!currentDriver) return;
            
            container.innerHTML = `
                <div class="driver-avatar">🚗</div>
                <div>
                    <div style="font-size: 14px; font-weight: bold;">${currentDriver.name}</div>
                    <div style="font-size: 12px; opacity: 0.9;">${currentDriver.phone}</div>
                    ${currentDriver.plate ? `<div style="font-size: 11px; opacity: 0.8;">${currentDriver.plate}</div>` : ''}
                </div>
            `;
        }
        
        // 路线选择
        document.querySelectorAll('.route-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // 移除所有激活状态
                document.querySelectorAll('.route-btn').forEach(b => b.classList.remove('active'));
                // 激活当前按钮
                this.classList.add('active');
                
                // 更新当前路线
                currentRoute = this.dataset.route;
                
                // 更新路线信息
                updateRouteInfo();
                calculatePrice();
            });
        });
        
        function updateRouteInfo() {
            const routeInfo = {
                xcToLz: { distance: '151公里', time: '约3小时9分钟' },
                lzToXc: { distance: '151公里', time: '约3小时9分钟' },
                xcToLb: { distance: '80公里', time: '约1小时40分钟' },
                gpToXc: { distance: '30公里', time: '约40分钟' }
            };
            
            const info = routeInfo[currentRoute] || routeInfo.xcToLz;
            document.getElementById('routeDistance').textContent = info.distance;
            document.getElementById('routeTime').textContent = info.time;
        }
        
        async function calculatePrice() {
            if (!currentDriver || !currentDriver.settings) return;
            
            const prices = currentDriver.settings;
            let price = 50;
            
            switch (currentRoute) {
                case 'xcToLz': price = prices.xcToLz || 50; break;
                case 'lzToXc': price = prices.lzToXc || 50; break;
                case 'xcToLb': price = prices.xcToLb || 40; break;
                case 'gpToXc': price = prices.gpToXc || 20; break;
            }
            
            document.getElementById('basePrice').textContent = `¥${price}`;
            document.getElementById('totalPrice').textContent = `¥${price}`;
            document.getElementById('finalPrice').textContent = `¥${price}`;
            
            return price;
        }
        
        async function getCurrentLocation() {
            const input = document.getElementById('pickupLocation');
            input.value = '定位中...';
            
            // 模拟定位
            setTimeout(() => {
                const locations = [
                    '忻城县人民医院门口',
                    '忻城县汽车站',
                    '忻城县中心广场',
                    '古蓬镇中心广场',
                    '柳州火车站北广场',
                    '来宾北站出站口'
                ];
                const randomLocation = locations[Math.floor(Math.random() * locations.length)];
                input.value = randomLocation;
            }, 1000);
        }
        
        async function submitOrder() {
            if (!currentDriver) {
                alert('请先连接司机');
                return;
            }
            
            const pickupLocation = document.getElementById('pickupLocation').value.trim();
            if (!pickupLocation) {
                alert('请填写上车位置');
                return;
            }
            
            const price = await calculatePrice();
            const passengerName = document.getElementById('passengerName').value.trim() || '乘客';
            const passengerPhone = document.getElementById('passengerPhone').value.trim();
            const locationNote = document.getElementById('locationNote').value.trim();
            
            // 获取路线目的地
            const destinations = {
                xcToLz: '柳州市区',
                lzToXc: '忻城县',
                xcToLb: '来宾北站',
                gpToXc: '忻城县'
            };
            
            const toLocation = destinations[currentRoute] || '目的地';
            
            const orderData = {
                driverCode: shareCode,
                from: pickupLocation,
                to: toLocation,
                amount: price,
                passengerName,
                passengerPhone,
                locationNote,
                route: currentRoute
            };
            
            try {
                const response = await fetch(`${API_BASE}/orders/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('订单提交成功！司机将尽快联系您');
                    
                    // 清空表单
                    document.getElementById('pickupLocation').value = '';
                    document.getElementById('locationNote').value = '';
                    document.getElementById('passengerName').value = '';
                    document.getElementById('passengerPhone').value = '';
                    
                    // 刷新订单列表
                    loadMyOrders();
                } else {
                    alert(data.message || '提交失败');
                }
            } catch (error) {
                alert('网络连接失败，请稍后重试');
            }
        }
        
        async function loadMyOrders() {
            if (!shareCode) return;
            
            try {
                const response = await fetch(`${API_BASE}/orders/passenger/${shareCode}`);
                const data = await response.json();
                
                if (data.success) {
                    renderMyOrders(data.orders);
                }
            } catch (error) {
                console.error('加载订单失败:', error);
            }
        }
        
        function renderMyOrders(orders) {
            const container = document.getElementById('myOrders');
            
            if (!orders || orders.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无订单</div>';
                return;
            }
            
            container.innerHTML = '';
            orders.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
                  .slice(0, 10)
                  .forEach(order => {
                const orderEl = document.createElement('div');
                orderEl.className = 'order-item';
                
                const statusText = {
                    'pending': '待接单',
                    'confirmed': '已确认',
                    'picked': '已接客',
                    'completed': '已完成',
                    'canceled': '已取消'
                }[order.status] || order.status;
                
                orderEl.innerHTML = `
                    <div class="order-header">
                        <span class="order-id">${order.orderId}</span>
                        <span class="order-status ${order.status}">${statusText}</span>
                    </div>
                    <div class="order-route">${order.from} → ${order.to}</div>
                    <div class="order-details">
                        <div class="order-time">${new Date(order.createdAt).toLocaleString()}</div>
                        <div class="order-price">¥${order.amount}</div>
                    </div>
                `;
                
                container.appendChild(orderEl);
            });
        }
        
        function refreshMyOrders() {
            loadMyOrders();
        }
        
        function contactDriver() {
            if (!currentDriver) {
                alert('请先连接司机');
                return;
            }
            
            if (currentDriver.phone) {
                if (confirm(`是否拨打司机电话：${currentDriver.phone}？`)) {
                    window.location.href = `tel:${currentDriver.phone}`;
                }
            } else {
                alert('司机未提供联系电话');
            }
        }
        
        function showHelp() {
            alert('使用帮助：\n\n1. 向司机索取6位分享码\n2. 输入分享码连接司机\n3. 选择路线和填写位置信息\n4. 提交订单等待司机联系\n5. 可在"订单"中查看状态\n\n建议添加到桌面方便下次使用');
        }
        
        function switchTab(tab) {
            // 这里可以扩展标签页功能
            console.log('切换到标签:', tab);
        }
        
        // 页面加载时检查本地保存的司机信息
        window.onload = function() {
            const savedCode = localStorage.getItem('passengerShareCode');
            const savedDriver = localStorage.getItem('passengerDriver');
            
            if (savedCode && savedDriver) {
                document.getElementById('shareCodeInput').value = savedCode;
                currentDriver = JSON.parse(savedDriver);
                shareCode = savedCode;
                showPassengerPage();
                updateDriverInfo();
                calculatePrice();
                loadMyOrders();
            }
            
            updateRouteInfo();
        };
    </script>
</body>
</html>
