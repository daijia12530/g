<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城际出行系统 | 司机端</title>
    <meta name="theme-color" content="#667eea">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* 司机端专属样式 */
        .driver-status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .status-online {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status-offline {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .online-indicator {
            background: #28a745;
            box-shadow: 0 0 10px #28a745;
        }
        .offline-indicator {
            background: #dc3545;
        }
    </style>
</head>
<body>
    <!-- 登录页面 -->
    <div id="loginPage" class="page active">
        <div class="login-container">
            <div class="login-header">
                <div class="login-logo">🚗</div>
                <h1>城际出行系统</h1>
                <p>忻城-柳州专线 | 司机管理端</p>
            </div>
            
            <div class="login-card">
                <div class="form-group">
                    <label>手机号码</label>
                    <input type="tel" id="loginPhone" class="form-control" placeholder="请输入手机号" value="13307464001">
                </div>
                
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="请输入密码" value="123456">
                </div>
                
                <div class="form-group">
                    <button class="btn btn-primary btn-block" onclick="login()">登录</button>
                </div>
                
                <div class="login-tips">
                    <p>默认账号: 13307464001 / 123456</p>
                    <p>支持多个司机账号注册</p>
                    <p>数据云端同步，安全可靠</p>
                </div>
            </div>
            
            <div style="margin-top: 30px; text-align: center; color: rgba(255,255,255,0.9);">
                <p>建议添加到桌面，方便下次使用</p>
            </div>
        </div>
    </div>
    
    <!-- 司机端主页面 -->
    <div id="driverPage" class="page">
        <div class="driver-header">
            <div class="driver-info-small">
                <div class="driver-avatar">🚗</div>
                <div>
                    <div class="driver-name" id="driverName">加载中...</div>
                    <div class="driver-phone" id="driverPhone">--</div>
                </div>
            </div>
            <button class="btn btn-small btn-secondary" onclick="logout()">退出</button>
        </div>
        
        <!-- 工作台内容 -->
        <div class="driver-content">
            <!-- 状态切换 -->
            <div class="card">
                <div class="driver-status status-offline" id="statusContainer">
                    <div class="status-indicator offline-indicator"></div>
                    <span>当前状态：离线</span>
                    <button class="btn btn-small btn-primary" onclick="toggleStatus()" style="margin-left: auto;">
                        上线接单
                    </button>
                </div>
            </div>
            
            <!-- 数据统计 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="todayOrders">0</div>
                    <div class="stat-label">今日订单</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="todayIncome">¥0</div>
                    <div class="stat-label">今日收入</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalOrders">0</div>
                    <div class="stat-label">总订单</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="driverBalance">¥0</div>
                    <div class="stat-label">可提现</div>
                </div>
            </div>
            
            <!-- 分享给乘客 -->
            <div class="share-area">
                <h3>分享给乘客</h3>
                <p>将此代码分享给乘客，乘客输入即可下单</p>
                <div class="share-code" id="shareCode">加载中...</div>
                <div class="share-actions">
                    <button class="btn btn-primary btn-small" onclick="copyShareCode()">复制代码</button>
                    <button class="btn btn-secondary btn-small" onclick="refreshShareCode()">刷新代码</button>
                </div>
                <div style="text-align: center; margin-top: 10px;">
                    <button class="btn btn-small" onclick="showQRCode()" style="background: none; color: #667eea; border: 1px solid #667eea;">
                        生成二维码
                    </button>
                </div>
            </div>
            
            <!-- 当前订单 -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">当前订单 <span class="badge" id="pendingCount">0</span></div>
                    <button class="btn btn-small" onclick="refreshOrders()">刷新</button>
                </div>
                <div id="ordersContainer" class="order-list">
                    <!-- 订单动态加载 -->
                </div>
            </div>
            
            <!-- 价格设置 -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">价格设置</div>
                    <button class="btn btn-small btn-primary" onclick="savePrices()">保存</button>
                </div>
                <div class="price-settings">
                    <div class="setting-row">
                        <span>忻城→柳州 (151km)</span>
                        <input type="number" id="priceXCtoLZ" class="price-input" value="50" min="30" max="200">
                    </div>
                    <div class="setting-row">
                        <span>柳州→忻城 (151km)</span>
                        <input type="number" id="priceLZtoXC" class="price-input" value="50" min="30" max="200">
                    </div>
                    <div class="setting-row">
                        <span>忻城→来宾北 (80km)</span>
                        <input type="number" id="priceXCtoLB" class="price-input" value="40" min="20" max="100">
                    </div>
                    <div class="setting-row">
                        <span>古蓬→忻城 (30km)</span>
                        <input type="number" id="priceGPtoXC" class="price-input" value="20" min="10" max="50">
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 底部导航 -->
        <div class="tab-bar">
            <button class="tab-item active" onclick="switchTab('dashboard')">
                <span class="tab-icon">🏠</span>
                <span>工作台</span>
            </button>
            <button class="tab-item" onclick="switchTab('orders')">
                <span class="tab-icon">📦</span>
                <span>订单</span>
            </button>
            <button class="tab-item" onclick="switchTab('earnings')">
                <span class="tab-icon">💰</span>
                <span>收入</span>
            </button>
            <button class="tab-item" onclick="switchTab('profile')">
                <span class="tab-icon">👤</span>
                <span>我的</span>
            </button>
        </div>
    </div>
    
    <!-- 模态框容器 -->
    <div id="modalContainer"></div>
    
    <script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
    <script>
        const API_BASE = window.location.hostname === 'localhost' ? 
            'http://localhost:3000/api' : 
            window.location.origin + '/api';
        
        let currentDriver = null;
        let driverToken = null;
        
        // 页面加载时检查登录状态
        document.addEventListener('DOMContentLoaded', function() {
            checkLoginStatus();
        });
        
        async function checkLoginStatus() {
            const token = localStorage.getItem('driverToken');
            if (token) {
                try {
                    const response = await fetch(`${API_BASE}/drivers/me`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        currentDriver = data.driver;
                        driverToken = token;
                        showDriverPage();
                        loadDriverData();
                    } else {
                        showLoginPage();
                    }
                } catch (error) {
                    showLoginPage();
                }
            } else {
                showLoginPage();
            }
        }
        
        async function login() {
            const phone = document.getElementById('loginPhone').value;
            const password = document.getElementById('loginPassword').value;
            
            try {
                const response = await fetch(`${API_BASE}/auth/driver/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    currentDriver = data.driver;
                    driverToken = data.token;
                    localStorage.setItem('driverToken', data.token);
                    showDriverPage();
                    loadDriverData();
                } else {
                    alert(data.message || '登录失败');
                }
            } catch (error) {
                alert('网络连接失败，请检查服务器');
            }
        }
        
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                localStorage.removeItem('driverToken');
                currentDriver = null;
                driverToken = null;
                showLoginPage();
            }
        }
        
        function showLoginPage() {
            document.getElementById('loginPage').classList.add('active');
            document.getElementById('driverPage').classList.remove('active');
        }
        
        function showDriverPage() {
            document.getElementById('loginPage').classList.remove('active');
            document.getElementById('driverPage').classList.add('active');
            
            // 更新司机信息
            if (currentDriver) {
                document.getElementById('driverName').textContent = currentDriver.name;
                document.getElementById('driverPhone').textContent = currentDriver.phone;
                document.getElementById('shareCode').textContent = currentDriver.shareCode || '---';
                
                // 更新价格设置
                if (currentDriver.settings) {
                    document.getElementById('priceXCtoLZ').value = currentDriver.settings.xcToLz || 50;
                    document.getElementById('priceLZtoXC').value = currentDriver.settings.lzToXc || 50;
                    document.getElementById('priceXCtoLB').value = currentDriver.settings.xcToLb || 40;
                    document.getElementById('priceGPtoXC').value = currentDriver.settings.gpToXc || 20;
                }
            }
        }
        
        async function loadDriverData() {
            if (!driverToken) return;
            
            try {
                // 加载统计数据
                const statsResponse = await fetch(`${API_BASE}/drivers/stats`, {
                    headers: { 'Authorization': `Bearer ${driverToken}` }
                });
                
                if (statsResponse.ok) {
                    const statsData = await statsResponse.json();
                    if (statsData.success) {
                        const stats = statsData.stats;
                        document.getElementById('todayOrders').textContent = stats.todayOrders || 0;
                        document.getElementById('todayIncome').textContent = '¥' + (stats.todayIncome || 0);
                        document.getElementById('totalOrders').textContent = stats.totalOrders || 0;
                        document.getElementById('driverBalance').textContent = '¥' + (stats.balance || 0);
                    }
                }
                
                // 加载订单
                loadOrders();
                
                // 更新状态显示
                updateStatusDisplay();
                
            } catch (error) {
                console.error('加载数据失败:', error);
            }
        }
        
        async function loadOrders() {
            try {
                const response = await fetch(`${API_BASE}/orders/driver/pending`, {
                    headers: { 'Authorization': `Bearer ${driverToken}` }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        renderOrders(data.orders);
                    }
                }
            } catch (error) {
                console.error('加载订单失败:', error);
            }
        }
        
        function renderOrders(orders) {
            const container = document.getElementById('ordersContainer');
            const pendingCount = orders.filter(o => o.status === 'pending').length;
            
            document.getElementById('pendingCount').textContent = pendingCount;
            
            if (orders.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无订单</div>';
                return;
            }
            
            container.innerHTML = '';
            orders.forEach(order => {
                const orderEl = createOrderElement(order);
                container.appendChild(orderEl);
            });
        }
        
        function createOrderElement(order) {
            const div = document.createElement('div');
            div.className = 'order-item';
            
            const statusText = {
                'pending': '待接单',
                'confirmed': '已确认',
                'picked': '已接客',
                'completed': '已完成',
                'canceled': '已取消'
            }[order.status] || order.status;
            
            div.innerHTML = `
                <div class="order-header">
                    <span class="order-id">${order.orderId}</span>
                    <span class="order-status ${order.status}">${statusText}</span>
                </div>
                <div class="order-route">${order.from} → ${order.to}</div>
                <div class="order-details">
                    <div class="order-time">${new Date(order.createdAt).toLocaleString()}</div>
                    <div class="order-price">¥${order.amount}</div>
                </div>
                <div class="passenger-info">
                    乘客: ${order.passengerName} 
                    ${order.passengerPhone ? `(${order.passengerPhone})` : ''}
                </div>
                ${order.locationNote ? `<div class="location-note">备注: ${order.locationNote}</div>` : ''}
                
                ${order.status === 'pending' ? `
                <div class="order-actions">
                    <button class="btn btn-small btn-primary" onclick="acceptOrder('${order.orderId}')">接单</button>
                    <button class="btn btn-small btn-secondary" onclick="rejectOrder('${order.orderId}')">拒绝</button>
                </div>
                ` : ''}
                
                ${order.status === 'confirmed' ? `
                <div class="order-actions">
                    <button class="btn btn-small btn-primary" onclick="updateOrderStatus('${order.orderId}', 'picked')">已接客</button>
                    <button class="btn btn-small btn-success" onclick="updateOrderStatus('${order.orderId}', 'completed')">完成</button>
                </div>
                ` : ''}
            `;
            
            return div;
        }
        
        async function acceptOrder(orderId) {
            if (!confirm('确定要接单吗？')) return;
            
            try {
                const response = await fetch(`${API_BASE}/orders/${orderId}/accept`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${driverToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                if (data.success) {
                    alert('接单成功！');
                    loadOrders();
                    loadDriverData();
                } else {
                    alert(data.message || '操作失败');
                }
            } catch (error) {
                alert('操作失败');
            }
        }
        
        async function rejectOrder(orderId) {
            if (!confirm('确定要拒绝此订单吗？')) return;
            
            try {
                const response = await fetch(`${API_BASE}/orders/${orderId}/reject`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${driverToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                if (data.success) {
                    alert('已拒绝订单');
                    loadOrders();
                } else {
                    alert(data.message || '操作失败');
                }
            } catch (error) {
                alert('操作失败');
            }
        }
        
        async function updateOrderStatus(orderId, status) {
            try {
                const response = await fetch(`${API_BASE}/orders/${orderId}/status`, {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `Bearer ${driverToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status })
                });
                
                const data = await response.json();
                if (data.success) {
                    alert('操作成功');
                    loadOrders();
                    loadDriverData();
                } else {
                    alert(data.message || '操作失败');
                }
            } catch (error) {
                alert('操作失败');
            }
        }
        
        async function savePrices() {
            const settings = {
                xcToLz: parseInt(document.getElementById('priceXCtoLZ').value) || 50,
                lzToXc: parseInt(document.getElementById('priceLZtoXC').value) || 50,
                xcToLb: parseInt(document.getElementById('priceXCtoLB').value) || 40,
                gpToXc: parseInt(document.getElementById('priceGPtoXC').value) || 20
            };
            
            try {
                const response = await fetch(`${API_BASE}/drivers/settings`, {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `Bearer ${driverToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ settings })
                });
                
                const data = await response.json();
                if (data.success) {
                    alert('价格设置已保存');
                    currentDriver.settings = settings;
                } else {
                    alert(data.message || '保存失败');
                }
            } catch (error) {
                alert('保存失败');
            }
        }
        
        async function toggleStatus() {
            const isOnline = currentDriver.isOnline || false;
            
            try {
                const response = await fetch(`${API_BASE}/drivers/status`, {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `Bearer ${driverToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ isOnline: !isOnline })
                });
                
                const data = await response.json();
                if (data.success) {
                    currentDriver.isOnline = !isOnline;
                    updateStatusDisplay();
                    alert(isOnline ? '已下线' : '已上线，可以接单');
                }
            } catch (error) {
                alert('操作失败');
            }
        }
        
        function updateStatusDisplay() {
            const container = document.getElementById('statusContainer');
            const isOnline = currentDriver.isOnline || false;
            
            if (isOnline) {
                container.className = 'driver-status status-online';
                container.innerHTML = `
                    <div class="status-indicator online-indicator"></div>
                    <span>当前状态：在线接单中</span>
                    <button class="btn btn-small btn-secondary" onclick="toggleStatus()" style="margin-left: auto;">
                        下线休息
                    </button>
                `;
            } else {
                container.className = 'driver-status status-offline';
                container.innerHTML = `
                    <div class="status-indicator offline-indicator"></div>
                    <span>当前状态：离线</span>
                    <button class="btn btn-small btn-primary" onclick="toggleStatus()" style="margin-left: auto;">
                        上线接单
                    </button>
                `;
            }
        }
        
        function copyShareCode() {
            const code = document.getElementById('shareCode').textContent;
            navigator.clipboard.writeText(code).then(() => {
                alert('分享码已复制到剪贴板');
            });
        }
        
        async function refreshShareCode() {
            if (!confirm('刷新后旧代码将失效，确定要继续吗？')) return;
            
            try {
                const response = await fetch(`${API_BASE}/drivers/share-code/refresh`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${driverToken}` }
                });
                
                const data = await response.json();
                if (data.success) {
                    currentDriver.shareCode = data.newCode;
                    document.getElementById('shareCode').textContent = data.newCode;
                    alert('分享码已刷新');
                }
            } catch (error) {
                alert('操作失败');
            }
        }
        
        function showQRCode() {
            const code = document.getElementById('shareCode').textContent;
            const url = `${window.location.origin}/passenger.html?code=${code}`;
            
            const modalHtml = `
                <div class="modal-content">
                    <div class="modal-header">
                        <div class="modal-title">分享二维码</div>
                        <button class="modal-close" onclick="closeModal()">&times;</button>
                    </div>
                    <div class="modal-body" style="text-align: center;">
                        <div id="qrcode"></div>
                        <p style="margin-top: 15px; font-size: 14px; color: #666;">
                            乘客扫描二维码即可进入下单页面
                        </p>
                        <p style="font-size: 12px; color: #999; margin-top: 5px;">
                            分享码: ${code}
                        </p>
                    </div>
                </div>
            `;
            
            showModal(modalHtml);
            
            // 生成二维码
            setTimeout(() => {
                const qr = qrcode(4, 'M');
                qr.addData(url);
                qr.make();
                document.getElementById('qrcode').innerHTML = qr.createImgTag(5);
            }, 100);
        }
        
        function refreshOrders() {
            loadOrders();
            loadDriverData();
        }
        
        function switchTab(tab) {
            // 这里可以扩展标签页功能
            console.log('切换到标签:', tab);
        }
        
        function showModal(html) {
            const modalContainer = document.getElementById('modalContainer');
            modalContainer.innerHTML = `<div class="modal active">${html}</div>`;
        }
        
        function closeModal() {
            const modalContainer = document.getElementById('modalContainer');
            modalContainer.innerHTML = '';
        }
        
        // 实时更新订单（每30秒）
        setInterval(() => {
            if (currentDriver && currentDriver.isOnline) {
                loadOrders();
            }
        }, 30000);
    </script>
</body>
</html>
